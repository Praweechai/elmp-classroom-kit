# Builds the Classroom MFE image off the laptop (Plan 3 · C-2 · D-52 · R-14).
# Output: ghcr.io/<owner>/elmp-mfe:<image_tag>  (the laptop only pulls it).
name: build-image

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag, e.g. verawood-1"
        required: true
      parallelism:
        description: "BuildKit max-parallelism (1 = safest memory, 2 = faster)"
        required: true
        default: "2"
      push:
        description: "Push the image to GHCR after the smoke test"
        type: boolean
        default: true

permissions:
  contents: read
  packages: write

concurrency:
  group: build-image
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: Free runner disk (~25 GB of unused SDKs)
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          docker image prune -af > /dev/null
          df -h /

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Tutor 22 (Verawood, C-7)
        run: |
          pip install --quiet "tutor>=22,<23" "tutor-mfe>=22,<23"
          tutor --version
          pip show tutor-mfe | grep -i '^version'

      - name: Configure Tutor with the ELMP plugin
        id: cfg
        env:
          OWNER: ${{ github.repository_owner }}
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          [[ "$IMAGE_TAG" =~ ^[a-z0-9][a-z0-9._-]{0,63}$ ]] || { echo "bad image_tag"; exit 1; }
          owner="$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')"
          image="ghcr.io/${owner}/elmp-mfe:${IMAGE_TAG}"
          echo "image=${image}" >> "$GITHUB_OUTPUT"
          mkdir -p "$(tutor plugins printroot)"
          cp tutor/elmp_classroom.py "$(tutor plugins printroot)/"
          tutor plugins enable mfe elmp_classroom
          tutor config save --set MFE_DOCKER_IMAGE="${image}"
          tutor images printtag mfe
          echo "--- MFE sources in the Dockerfile"
          grep -E '^ADD .*\.git' "$(tutor config printroot)/env/plugins/mfe/build/mfe/Dockerfile"

      - name: BuildKit builder with limited parallelism (R-14 memory guard)
        env:
          PARALLELISM: ${{ inputs.parallelism }}
        run: |
          [[ "$PARALLELISM" =~ ^[1-4]$ ]] || { echo "parallelism must be 1-4"; exit 1; }
          printf '[worker.oci]\n  max-parallelism = %s\n' "$PARALLELISM" > buildkitd.toml
          docker buildx create --use --name elmp --driver docker-container --config ./buildkitd.toml
          docker buildx inspect --bootstrap | head -5

      - name: Build (measured)
        run: |
          ( while true; do echo "$(date +%s) $(free -m | awk '/^Mem:/{print $3}')" >> mem.log; sleep 10; done ) &
          sampler=$!
          start=$(date +%s)
          tutor images build mfe --no-registry-cache
          end=$(date +%s)
          kill "$sampler"
          peak=$(sort -k2 -n mem.log | tail -1 | cut -d' ' -f2)
          {
            echo "build_seconds=$((end - start))"
            echo "peak_used_mb=${peak}"
          } >> build-stats.txt
          cat build-stats.txt

      - name: Smoke test the image
        run: |
          image='${{ steps.cfg.outputs.image }}'
          docker run --rm --entrypoint sh "$image" -c '
            set -e
            for app in learning learner-dashboard authn account; do
              test -s /openedx/dist/$app/index.html && echo "ok  $app"
            done
            ls /openedx/dist'
          docker image inspect "$image" --format 'size_mb={{ div .Size 1048576 }}' | tee -a build-stats.txt

      - name: Push to GHCR
        if: ${{ inputs.push }}
        run: |
          echo '${{ secrets.GITHUB_TOKEN }}' | docker login ghcr.io -u '${{ github.actor }}' --password-stdin
          tutor images push mfe
          docker image inspect '${{ steps.cfg.outputs.image }}' --format 'digest={{ index .RepoDigests 0 }}' | tee -a build-stats.txt

      - name: Summary
        if: always()
        run: |
          {
            echo "### Classroom image \`${{ steps.cfg.outputs.image }}\`"
            echo '```'
            cat build-stats.txt 2>/dev/null || echo "no stats (build failed early)"
            echo "parallelism=${{ inputs.parallelism }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-stats-${{ inputs.image_tag }}
          path: |
            mem.log
            build-stats.txt
          if-no-files-found: ignore
