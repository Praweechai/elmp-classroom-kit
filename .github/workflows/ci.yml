# Kit CI (Plan 3 doc 08 §1): lint, unit + a11y tests, token and dist freshness, bundle budget.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - name: Generated tokens are up to date
        run: node scripts/build-tokens.js --check
      - name: Committed dist/ matches src/ (forks install the kit without building it)
        run: |
          npm run build
          git status --porcelain dist
          git diff --exit-code --stat dist || { echo "::error::dist/ is stale: run npm run build and commit"; exit 1; }
          [ -z "$(git status --porcelain dist)" ] || { echo "::error::untracked files in dist/"; exit 1; }
      - name: Bundle budget (NFR-C3 ≤ 60 kB gzip)
        run: node scripts/size-check.js 60
