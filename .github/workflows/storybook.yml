# Storybook preview on GitHub Pages + visual regression (Plan 3 · P3-2.07 · doc 08 §1).
# Builds here, never on the laptop (C-2). New baselines are uploaded as the "new-baselines" artifact.
name: storybook

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: storybook-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx storybook build --quiet --output-dir storybook-static
      - uses: actions/upload-artifact@v4
        with:
          name: storybook-static
          path: storybook-static

  visual:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: storybook-static
          path: storybook-static
      # GitHub runners sometimes cannot reach the Ubuntu mirrors (seen 2026-11-11); the libraries are already on the image
      - run: npx playwright install --with-deps chromium || npx playwright install chromium
      - name: Screenshots at 1440 / 390 / 360, EN + TH
        run: npx playwright test --update-snapshots=missing
      - name: Collect new baselines (commit them after review)
        if: always()
        run: |
          mkdir -p new-baselines
          git ls-files --others --exclude-standard visual/__screenshots__ | xargs -r -I{} cp {} new-baselines/
          echo "new baselines: $(ls new-baselines | wc -l)"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: new-baselines
          path: new-baselines
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: [build, visual]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: storybook-static
          path: storybook-static
      - uses: actions/upload-pages-artifact@v3
        with:
          path: storybook-static
      - id: deploy
        uses: actions/deploy-pages@v4
